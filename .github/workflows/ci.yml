name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Generate Prisma Client
        run: |
          prisma generate
      - name: Code Syntax & Type Validation
        run: |
          python -m py_compile ml/config.py ml/features.py ml/training/*.py ml/inference/*.py backend/*.py backend/api/*.py backend/store/*.py backend/jobs/*.py
      - name: Run Test Suite
        run: |
          python -m pytest tests/ml/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
